<audio id="song" src="/vimlesh.mp3" preload="auto" autoplay loop playsinline></audio>

          placeholder="Enter your username"
          autocomplete="username" required>

        <input id="password" name="password" type="password"
          placeholder="Enter your password"
          autocomplete="current-password" required>

        <p id="error" class="error" role="alert"></p>
      </form>

      Our song is getting ready ♡
    </div>

<script>
(function () {
  const song = document.getElementById("song");
  const lyricsScroll = document.getElementById("lyricsScroll");
  const musicStatus = document.getElementById("musicStatus");
  const form = document.getElementById("loginForm");
  const loginButton = document.getElementById("loginButton");
  const error = document.getElementById("error");

  // Lyrics appear at 14 minutes and 30 seconds.
  const LYRICS_START_AT = 14 * 60 + 30;

  let initialized = false;
  let lyricLines = [];

  function startSong() {
    if (song.paused) {
      song.play().then(function () {
        musicStatus.textContent = "Playing our song ♡";
      }).catch(function () {
        musicStatus.textContent = "Tap anywhere to start our song ♡";
      });
    }
  }

  function initializeSong() {
    if (initialized) return;
    initialized = true;

    // Set the starting position to zero only once.
    try {
      song.currentTime = 0;
    } catch (_) {}

    startSong();
  }

  song.addEventListener("loadedmetadata", initializeSong, { once: true });
  song.addEventListener("canplay", initializeSong, { once: true });

  document.addEventListener("pointerdown", startSong, { once: true });
  document.addEventListener("keydown", startSong, { once: true });

  if (song.readyState >= 1) {
    initializeSong();
  }

  fetch("/lyrics.txt", { cache: "no-cache" })
    .then(function (response) {
      if (!response.ok) throw new Error("Lyrics unavailable");
      return response.text();
    })
    .then(function (text) {
      lyricLines = text
        .split(/\\r?\\n/)
        .map(function (line) { return line.trim(); })
        .filter(function (line) { return line.length > 0; });

      lyricsScroll.innerHTML = "";

      lyricLines.forEach(function (line, index) {
        const paragraph = document.createElement("p");
        paragraph.className = "lyric-line";
        paragraph.textContent = line;
        paragraph.dataset.index = String(index);
        lyricsScroll.appendChild(paragraph);
      });

      updateLyrics();
    })
    .catch(function () {
      lyricsScroll.innerHTML =
        '<p class="lyric-line">Our song, our memories ♡</p>';
    });

  function updateLyrics() {
    const currentTime = song.currentTime;

    // Hide all lyrics until playback reaches 14:30.
    if (currentTime < LYRICS_START_AT) {
      lyricsScroll.classList.remove("started");
      return;
    }

    lyricsScroll.classList.add("started");

    const elements = lyricsScroll.querySelectorAll(".lyric-line");
    if (!elements.length) return;

    const duration = Number.isFinite(song.duration)
      ? song.duration
      : LYRICS_START_AT + 1;

    const remainingDuration = Math.max(1, duration - LYRICS_START_AT);
    const progress = Math.min(
      0.9999,
      Math.max(0, (currentTime - LYRICS_START_AT) / remainingDuration)
    );

    const activeIndex = Math.min(
      elements.length - 1,
      Math.floor(progress * elements.length)
    );

    elements.forEach(function (element, index) {
      element.classList.toggle("active", index === activeIndex);
      element.classList.toggle("past", index < activeIndex);
    });
  }

  song.addEventListener("timeupdate", updateLyrics);
  song.addEventListener("seeked", updateLyrics);

  // Login
  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    error.style.display = "none";
    error.textContent = "";
    loginButton.disabled = true;
    loginButton.textContent = "Opening...";

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    try {
      const response = await fetch("/__login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        credentials: "same-origin",
        body: JSON.stringify({
          username: username,
          password: password
        })
      });

      if (response.ok) {
        window.location.href = "/";
        return;
      }

      let message = "Incorrect username or password. Try again ♡";

      try {
        const result = await response.json();
        if (result && result.error) message = result.error;
      } catch (_) {}

      error.textContent = message;
      error.style.display = "block";
    } catch (_) {
      error.textContent = "Something went wrong. Please try again.";
      error.style.display = "block";
    } finally {
      loginButton.disabled = false;
      loginButton.textContent = "Open our little world ♡";
    }
  });
})();
</script>
